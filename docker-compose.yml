services:
  koliss-sourcing:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOCKER_NAMESPACE:-koliss}/koliss-sourcing:latest
    container_name: koliss-sourcing-dev
    restart: always
    ports:
      - '8099:8099'
    depends_on:
      sourcing-postgres:
        condition: service_healthy

  sourcing-postgres:
    image: postgres:16
    container_name: sourcing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sourcing_db
      POSTGRES_USER: sourcing
      POSTGRES_PASSWORD: sourcing
    ports:
      - "${SOURCING_DB_PORT:-5433}:5432"
    volumes:
      - sourcing_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U sourcing -d sourcing_db' ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sourcing_postgres_data:
